<!doctype html>
<html lang="fr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Temhalo · Contrôle local</title><link rel="stylesheet" href="/assets/app.css"><script src="/assets/app.js" defer></script></head>
<body>
<main id="dock" aria-label="Commandes de délai">
 <header><h1>Votre tempo</h1><p id="connection" role="status">Connexion à Temhalo…</p></header>
 <section class="readings"><div><span>Délai actuel</span><strong id="current">—</strong></div><div><span>Cible appliquée</span><strong id="target">00:00</strong></div></section>
 <p id="phase" aria-live="polite">En attente des mesures.</p>
 <div id="presets" class="row" aria-label="Presets"></div>
 <form id="delay-form"><label for="seconds">Nouvelle cible · secondes</label><div class="row"><input id="seconds" type="number" min="0" max="300" step="1" value="0" required><button id="apply" type="submit" class="primary">Appliquer</button></div><input id="range" type="range" aria-label="Nouvelle cible de délai en secondes" min="0" max="300" step="1" value="0"><div class="ends"><span>0 s</span><span>300 s · 5 min</span></div></form>
 <div class="row quick"><button type="button" data-command="protect">Protection</button><button type="button" data-command="zero">Direct · 0 s</button><button type="button" data-command="minus">−10 s</button><button type="button" data-command="plus">+10 s</button></div>
 <p id="feedback" role="status" aria-live="polite"></p><ul id="outputs" aria-label="État des destinations"></ul>
 <footer>Le délai indiqué est ajouté par Temhalo. La latence de la plateforme et du lecteur s’ajoute.</footer>
</main>
</body></html>
