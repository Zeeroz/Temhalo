<!doctype html>
<html lang="fr">
<head>
  <meta charset="utf-8">
  <meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'self'; style-src 'self'; connect-src ws://127.0.0.1:*; img-src 'self'; base-uri 'none'; form-action 'none'">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <link rel="stylesheet" href="inspector.css">
  <script defer src="inspector.js"></script>
  <title>Temhalo · Stream Deck</title>
</head>
<body>
  <h1 id="action-name">Temhalo</h1>
  <section id="options" hidden aria-label="Réglage de la touche">
    <div class="field-row"><label id="value-label" for="value">Délai</label><div class="number-control"><input id="value" type="number" min="0" max="300" step="1" value="30" disabled><span>s</span><span id="settings-status" role="status" aria-live="polite"></span></div></div>
    <div class="field-row slider-row"><span></span><input id="range" aria-label="Délai de la touche, en secondes" type="range" min="0" max="300" step="1" value="30" disabled></div>
    <div class="field-row"><span></span><div id="quick-values" class="quick-values" role="group" aria-label="Valeurs rapides"></div></div>
  </section>
  <p id="description">En attente de Stream Deck…</p>
  <div id="connection"><span id="connection-state" data-state="connecting"><i aria-hidden="true"></i><span id="connection-label">Connexion à Temhalo…</span></span><button id="refresh" type="button" hidden disabled>Réessayer</button></div>
  <p id="status" role="status" aria-live="polite" hidden>En attente de Stream Deck…</p>
</body>
</html>
