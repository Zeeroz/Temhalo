name: Windows

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:
    inputs:
      recovery_run_id:
        description: 'Reprise uniquement : identifiant du run dont le job build a réussi'
        type: string
        default: ''
      recovery_tag:
        description: 'Reprise uniquement : tag exact du brouillon à publier'
        type: string
        default: ''

permissions:
  contents: read

concurrency:
  group: windows-${{ github.ref }}-${{ inputs.recovery_run_id || 'build' }}
  cancel-in-progress: ${{ !startsWith(github.ref, 'refs/tags/') }}

jobs:
  build:
    if: github.event_name != 'workflow_dispatch' || inputs.recovery_run_id == ''
    runs-on: windows-2025
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: actions/setup-dotnet@26b0ec14cb23fa6904739307f278c14f94c95bf1 # v5
        with:
          dotnet-version: |
            10.0.401
            8.0.x
      - name: Audit des fichiers publics
        shell: pwsh
        run: ./tools/Test-PublicSource.ps1
      - name: Vérifier la version du tag
        if: startsWith(github.ref, 'refs/tags/')
        shell: pwsh
        run: |
          [xml]$props = Get-Content Directory.Build.props -Raw
          if ($env:GITHUB_REF_NAME -cne "v$($props.Project.PropertyGroup.Version)") { throw 'Le tag et Directory.Build.props doivent avoir la même version.' }
      - name: Restaurer, compiler et tester
        shell: pwsh
        run: |
          dotnet restore Temhalo.sln -p:Platform=x64 --locked-mode
          if ($LASTEXITCODE) { throw 'Restore failed' }
          dotnet build Temhalo.sln -c Release -p:Platform=x64 --no-restore
          if ($LASTEXITCODE) { throw 'Build failed' }
          dotnet test Temhalo.sln -c Release -p:Platform=x64 --no-build --no-restore --logger trx --results-directory artifacts/test-results
          if ($LASTEXITCODE) { throw 'Tests failed' }
      - name: Produire le ZIP et l’installeur
        if: github.event_name != 'pull_request'
        shell: pwsh
        run: |
          ./tools/Package-Windows.ps1
          ./tools/Build-Installer.ps1
          # The deletion inventory must include every shipped version and stay in Git.
          git diff --exit-code -- packaging/windows/uninstall-inventory.json
          if ($LASTEXITCODE) { throw 'Inventaire modifié : exécuter Build-Installer localement et committer uninstall-inventory.json avant de publier.' }
      - name: Tester installation, mise à jour et désinstallation isolées
        if: github.event_name != 'pull_request'
        shell: pwsh
        run: ./tools/Test-Installer.ps1
      - name: Conserver les livrables
        if: github.event_name != 'pull_request'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: Temhalo-windows-x64
          if-no-files-found: error
          retention-days: 7
          path: |
            artifacts/packages/Temhalo-*-Setup-x64.exe
            artifacts/packages/Temhalo-*-Setup-x64.exe.sha256
            artifacts/packages/Temhalo-*-win-x64.zip
            artifacts/packages/Temhalo-*-win-x64.zip.sha256

  release:
    if: startsWith(github.ref, 'refs/tags/') && github.repository == 'Zeeroz/Temhalo'
    needs: build
    runs-on: windows-2025
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8
        with:
          name: Temhalo-windows-x64
          path: artifacts/packages
      - name: Publier la release après vérification des fichiers
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: ./tools/Publish-Release.ps1

  recover-release:
    if: github.event_name == 'workflow_dispatch' && inputs.recovery_run_id != '' && github.repository == 'Zeeroz/Temhalo'
    runs-on: windows-2025
    timeout-minutes: 10
    permissions:
      contents: write
      actions: read
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - name: Vérifier le tag, le commit, le job build et les actifs de la CI
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
          RECOVERY_RUN_ID: ${{ inputs.recovery_run_id }}
          RECOVERY_TAG: ${{ inputs.recovery_tag }}
        run: ./tools/Test-ReleaseRecovery.ps1 -RunId $env:RECOVERY_RUN_ID -Tag $env:RECOVERY_TAG
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8
        with:
          name: Temhalo-windows-x64
          path: artifacts/packages
          run-id: ${{ inputs.recovery_run_id }}
          github-token: ${{ github.token }}
      - name: Reprendre sans remplacer les fichiers du brouillon
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
          RECOVERY_TAG: ${{ inputs.recovery_tag }}
        run: ./tools/Publish-Release.ps1 -Tag $env:RECOVERY_TAG -ResumeDraft
