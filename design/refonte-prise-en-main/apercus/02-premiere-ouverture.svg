<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="900" viewBox="0 0 1280 900" role="img"><title>Temhalo — 02-premiere-ouverture — aperçu de conception</title><rect x="0" y="0" width="1280" height="900" rx="0" fill="#0D1218" stroke="none"/><rect x="0" y="0" width="1280" height="64" rx="0" fill="#202B36" stroke="none"/><path d="M0 63L1280 63" transform="" fill="none" stroke="#687E94" stroke-width="1"/><text x="20" y="24" font-family="Inter" font-size="12" font-weight="600" fill="#F1F5F9" text-anchor="start">Maquette · aperçu de conception</text><text x="20" y="45" font-family="Inter" font-size="12" font-weight="400" fill="#B4C1CF" text-anchor="start">Données fictives · aucune action sur vos comptes ou votre live</text><text x="805" y="35" font-family="Inter" font-size="12" font-weight="400" fill="#B4C1CF" text-anchor="start">Situation</text><rect x="870" y="14" width="210" height="36" rx="8" fill="#0D1218" stroke="#687E94"/><text x="884" y="34" font-family="Inter" font-size="12" font-weight="400" fill="#F1F5F9" text-anchor="start">Première ouverture</text><path d="m1061 26 5 5-5 5" fill="none" stroke="#96A7B9" stroke-width="1.5" stroke-linecap="round"/><rect x="1096" y="14" width="164" height="36" rx="8" fill="#1D2935" stroke="#2C3C4C"/><text x="1178" y="36" font-family="Inter" font-size="12" font-weight="500" fill="#96A7B9" text-anchor="middle">Simuler le flux OBS</text><rect x="0" y="64" width="1280" height="32" rx="0" fill="#151D26" stroke="none"/><g transform="translate(12 72) scale(0.125)" fill="none" stroke-width="12" stroke-linecap="round"><path stroke="#7CE8CD" d="M86.726 37.235A40 40 0 1 0 86.726 90.765"/><path stroke="#B9B2FF" d="M105.985 44.608A40 40 0 0 1 105.985 83.392"/></g><text x="36" y="83" font-family="Inter" font-size="12" font-weight="400" fill="#F1F5F9" text-anchor="start">Temhalo</text><text x="1175" y="82" font-family="Inter" font-size="12" font-weight="400" fill="#B4C1CF" text-anchor="start">—     □     ×</text><path d="M0 172L1280 1