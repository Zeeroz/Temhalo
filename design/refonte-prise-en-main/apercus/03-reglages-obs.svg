<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="900" viewBox="0 0 1280 900" role="img"><title>Temhalo — 03-reglages-obs — aperçu de conception</title><rect x="0" y="0" width="1280" height="900" rx="0" fill="#0D1218" stroke="none"/><rect x="0" y="0" width="1280" height="64" rx="0" fill="#202B36" stroke="none"/><path d="M0 63L1280 63" transform="" fill="none" stroke="#687E94" stroke-width="1"/><text x="20" y="24" font-family="Inter" font-size="12" font-weight="600" fill="#F1F5F9" text-anchor="start">Maquette · aperçu de conception</text><text x="20" y="45" font-family="Inter" font-size="12" font-weight="400" fill="#B4C1CF" text-anchor="start">Données fictives · aucune action sur vos comptes ou votre live</text><text x="805" y="35" font-family="Inter" font-size="12" font-weight="400" fill="#B4C1CF" text-anchor="start">Situation</text><rect x="870" y="14" width="210" height="36" rx="8" fill="#0D1218" stroke="#687E94"/><text x="884" y="34" font-family="Inter" font-size="12" font-weight="400" fill="#F1F5F9" text-anchor="start">Première ouverture</text><path d="m1061 26 5 5-5 5" fill="none" stroke="#96A7B9" stroke-width="1.5" stroke-linecap="round"/><rect x="1096" y="14" width="164" height="36" rx="8" fill="#1D2935" stroke="#2C3C4C"/><text x="1178" y="36" font-family="Inter" font-size="12" font-weight="500" fill="#96A7B9" text-anchor="middle">Simuler le flux OBS</text><rect x="0" y="64" width="1280" height="32" rx="0" fill="#151D26" stroke="none"/><g transform="translate(12 72) scale(0.125)" fill="none" stroke-width="12" stroke-linecap="round"><path stroke="#7CE8CD" d="M86.726 37.235A40 40 0 1 0 86.726 90.765"/><path stroke="#B9B2FF" d="M105.985 44.608A40 40 0 0 1 105.985 83.392"/></g><text x="36" y="83" font-family="Inter" font-size="12" font-weight="400" fill="#F1F5F9" text-anchor="start">Temhalo</text><text x="1175" y="82" font-family="Inter" font-size="12" font-weight="400" fill="#B4C1CF" text-anchor="start">—     □     ×</text><path d="M0 172L1280 172" transform="" fill="none" stroke="#2C3C4C" stroke-width="1"/><text x="40" y="135" font-family="Inter" font-size="14" font-weight="500" fill="#B4C1CF" text-anchor="start">Direct</text><text x="112" y="135" font-family="Inter" font-size="14" font-weight="500" fill="#F1F5F9" text-anchor="start">Diffusion</text><rect x="126" y="154" width="20" height="3" rx="2" fill="#7CE8CD" stroke="none"/><text x="210" y="135" font-family="Inter" font-size="14" font-weight="500" fill="#B4C1CF" text-anchor="start">Réglages</text><text x="825" y="138" font-family="Inter" font-size="12" font-weight="400" fill="#96A7B9" text-anchor="start">Relais arrêté</text><text x="28" y="228" font-family="Space Grotesk" font-size="28" font-weight="600" fill="#F1F5F9" text-anchor="start">Préparer votre diffusion</text><text x="28" y="259" font-family="Inter" font-size="14" font-weight="400" fill="#B4C1CF" text-anchor="start">Trois étapes. Vos choix seront conservés pour vos prochains lives.</text><circle cx="42" cy="315" r="14" fill="#0D1218" stroke="#75D8A5"/><path d="m36 315 4 4 8-9" fill="none" stroke="#75D8A5" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/><text x="68" y="319" font-family="Inter" font-size="14" font-weight="500" fill="#96A7B9" text-anchor="start">Plateforme</text><circle cx="454" cy="315" r="14" fill="#7CE8CD" stroke="#7CE8CD"/><text x="454" y="318" font-family="Inter" font-size="12" font-weight="500" fill="#0D1218" text-anchor="middle">2</text><text x="480" y="319" font-family="Inter" font-size="14" font-weight="500" fill="#F1F5F9" text-anchor="start">Réglages OBS</text><circle cx="866" cy="315" r="14" fill="#0D1218" stroke="#687E94"/><text x="866" y="318" font-family="Inter" font-size="12" font-weight="500" fill="#96A7B9" text-anchor="middle">3</text><text x="892" y="319" font-family="Inter" font-size="14" font-weight="500" fill="#96A7B9" text-anchor="start">Démarrage</text><text x="28" y="391" font-family="Space Grotesk" font-size="20" font-weight="600" fill="#F1F5F9" text-anchor="start">Reliez OBS à Temhalo.</text><text x="28" y="424" font-family="Inter" font-size="14" font-weight="400" fill="#B4C1CF" text-anchor="start">Ces deux valeurs se renseignent une seule fois dans votre profil OBS.</text><rect x="28" y="458" width="1224" height="230" rx="12" fill="#151D26" stroke="none"/><text x="52" y="500" font-family="Space Grotesk" font-size="18" font-weight="600" fill="#F1F5F9" text-anchor="start">Dans les paramètres d’OBS</text><text x="52" y="537" font-family="Inter" font-size="14" font-weight="400" fill="#B4C1CF" text-anchor="start">1. Ouvrez Paramètres → Stream (flux).</text><text x="52" y="566" font-family="Inter" font-size="14" font-weight="400" fill="#B4C1CF" text-anchor="start">2. Dans Service, choisissez Personnalisé.</text><text x="52" y="595" font-family="Inter" font-size="14" font-weight="400" fill="#B4C1CF" text-anchor="start">3. Collez le serveur et la clé locale, puis validez.</text><text x="52" y="637" font-family="Inter" font-size="12" font-weight="400" fill="#B4C1CF" text-anchor="start">Vos clés de plateforme restent dans Temhalo.</text><text x="52" y="658" font-family="Inter" font-size="12" font-weight="400" fill="#B4C1CF" text-anchor="start">Dans OBS, utilisez uniquement la clé locale stream.</text><text x="664" y="494" font-family="Inter" font-size="12" font-weight="400" fill="#96A7B9" text-anchor="start">Serveur OBS</text><rect x="664" y="509" width="564" height="58" rx="8" fill="#0D1218" stroke="#687E94"/><text x="680" y="541" font-family="JetBrains Mono" font-size="14" font-weight="500" fill="#F1F5F9" text-anchor="start">rtmp://127.0.0.1:1935/live</text><rect x="1176" y="516" width="44" height="44" rx="8" fill="#1D2935" stroke="#687E94"/><g fill="none" stroke="#B4C1CF" stroke-width="1.4"><rect x="1194" y="533" width="12" height="12" rx="2"/><path d="M1202 533v-3h-12v12h4"/></g><text x="664" y="600" font-family="Inter" font-size="12" font-weight="400" fill="#96A7B9" text-anchor="start">Clé locale OBS</text><rect x="664" y="615" width="564" height="52" rx="8" fill="#0D1218" stroke="#687E94"/><text x="680" y="645" font-family="JetBrains Mono" font-size="14" font-weight="500" fill="#F1F5F9" text-anchor="start">stream</text><rect x="1176" y="619" width="44" height="44" rx="8" fill="#1D2935" stroke="#687E94"/><g fill="none" stroke="#B4C1CF" stroke-width="1.4"><rect x="1194" y="636" width="12" height="12" rx="2"/><path d="M1202 636v-3h-12v12h4"/></g><path d="M28 718L1252 718" transform="" fill="none" stroke="#2C3C4C" stroke-width="1"/><text x="28" y="751" font-family="Inter" font-size="14" font-weight="500" fill="#F1F5F9" text-anchor="start">Réglages vidéo et audio à vérifier</text><text x="1234" y="753" font-family="Inter" font-size="20" font-weight="400" fill="#96A7B9" text-anchor="start">+</text><path d="M28 790L1252 790" transform="" fill="none" stroke="#2C3C4C" stroke-width="1"/><text x="40" y="831" font-family="Inter" font-size="14" font-weight="400" fill="#B4C1CF" text-anchor="start">Retour</text><text x="135" y="823" font-family="Inter" font-size="12" font-weight="400" fill="#96A7B9" text-anchor="start">Ce bouton confirme la lecture du guide. La connexion sera</text><text x="135" y="842" font-family="Inter" font-size="12" font-weight="400" fill="#96A7B9" text-anchor="start">vérifiée à la réception du flux.</text><rect x="989" y="806" width="263" height="44" rx="8" fill="#1D2935" stroke="#687E94"/><text x="1120.5" y="833" font-family="Inter" font-size="14" font-weight="500" fill="#F1F5F9" text-anchor="middle">J’ai terminé dans OBS  →</text></svg>